name: Build APK
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Préparer l'application
        run: |
          unzip -q MY-BOX-GAME.zip
          mkdir -p www
          cp -r MY-BOX-GAME/index.html MY-BOX-GAME/sw.js MY-BOX-GAME/manifest.json MY-BOX-GAME/assets MY-BOX-GAME/pages www/
          mkdir -p /tmp/eng && cd /tmp/eng && npm pack @thenick775/mgba-wasm@2.3.3 --silent && tar xzf ./*.tgz && cd -
          cp /tmp/eng/package/dist/mgba.js /tmp/eng/package/dist/mgba.wasm www/assets/vendor/emulator/
          cp /tmp/eng/package/LICENSE* www/assets/vendor/emulator/ || true
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "MY BOX_GAME" com.mybox.game --web-dir=www
          npx cap add android
          npx cap sync android
      - name: Compiler l'APK
        run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MY-BOX-GAME-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
