name: Generer APK MY-BOX-GAME

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les dependances
        run: |
          npm install

      - name: Installer Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Verifier la configuration
        run: |
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            npx cap init "MY-BOX-GAME" "com.moggames.myboxgame" --web-dir=www
          fi

      - name: Copier les fichiers web
        run: |
          npx cap copy android

      - name: Compiler APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: MY-BOX-GAME-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
